portfolio_analyticsengineering_ga4:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('DBT_BQ_PROJECT', 'your-gcp-project-id') }}"
      dataset: "{{ env_var('DBT_BQ_DATASET', 'analytics_engineering_ga4') }}"
      location: "{{ env_var('DBT_BQ_LOCATION', 'US') }}"
      keyfile: "{{ env_var('GCP_SERVICE_ACCOUNT_LOAD_AND_DBT') }}"
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive
