services:
  lightdash:
    platform: linux/amd64
    image: ${LIGHTDASH_IMAGE:-lightdash/lightdash:2.17.0}
    depends_on:
      db:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      PGHOST: ${PGHOST:-db}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-lightdash}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-lightdash}
      LIGHTDASH_SECRET: ${LIGHTDASH_SECRET}
      PORT: ${PORT:-8080}
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOW_MULTIPLE_ORGS: ${ALLOW_MULTIPLE_ORGS:-false}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      GROUPS_ENABLED: ${GROUPS_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-lightdash}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      LIGHTDASH_INSTALL_TYPE: docker_image
      LIGHTDASH_MIGRATION_EXECUTION_MODE: compose
      DBT_PROJECT_DIR: /usr/app/dbt
    volumes:
      - ../dbt:/usr/app/dbt:ro
    ports:
      - "${PORT:-8080}:${PORT:-8080}"

  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-lightdash}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:-lightdash}
    volumes:
      - lightdash-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-lightdash} -d ${PGDATABASE:-lightdash}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lightdash}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - lightdash-minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-lightdash} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${S3_BUCKET:-lightdash};
      "

volumes:
  lightdash-db-data:
  lightdash-minio-data:
